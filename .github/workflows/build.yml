name: Build Native PSPP 2.1.2 & Android APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-native-and-apk:
    name: Cross-Compile PSPP 2.1.2 (NDK r27) & Build APKs
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build dependencies (Autotools, GPG, GSL/XML tools, Texinfo)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint libtool pkg-config \
            gettext texinfo bison flex gperf gnupg curl xz-utils \
            python3 libxml2-utils imagemagick

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android SDK Platform 35/36 and NDK r27 (27.0.12077973)
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Cache cross-built native dependency sysroots
        uses: actions/cache@v4
        with:
          path: |
            native-build/sysroot
            native-build/downloads
          key: pspp-2.1.2-ndk-r27-${{ hashFiles('build-native.sh', 'patches/*.patch', 'app/src/main/cpp/pspp_jni.c') }}

      - name: Run build-native.sh (Download, GPG Verify, Patch, Cross-Compile for arm64-v8a, armeabi-v7a, x86_64)
        run: |
          chmod +x ./build-native.sh
          ./build-native.sh 2>&1 | tee native-build.log

      - name: Ensure debug.keystore exists for debug and fallback release signing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Decode Release Keystore (if signing secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret configured; release build will use debug.keystore fallback."
          fi

      - name: Build Debug, Release, ABI Split, and Universal APKs
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle assembleDebug assembleRelease -PenableAbiSplits=true --stacktrace 2>&1 | tee gradle-build.log

      - name: Run JVM Unit & Robolectric Sample .sps Regression Tests
        run: |
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee unit-test.log

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumented Smoke Test on Emulator (reactivecircus/android-emulator-runner)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            gradle connectedDebugAndroidTest --stacktrace 2>&1 | tee instrumented-test.log

      - name: Upload Native Libraries (.so), APKs, and Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pspp-studio-apks-and-logs
          path: |
            app/src/main/jniLibs/**/*.so
            app/build/outputs/apk/**/*.apk
            app/build/reports/tests/**/*
            app/build/reports/androidTests/**/*
            *.log
